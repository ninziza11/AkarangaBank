
name: Build and Deploy AkarangaBank

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and Deploy to myASP.NET
    runs-on: windows-latest

    steps:
      # 1. Recuperer le code GitHub
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Installer .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # 3. Restaurer les dependances
      - name: Restore Dependencies
        run: dotnet restore

      # 4. Construire le projet
      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      # 5. Publier l'application
      - name: Publish Application
        run: dotnet publish --configuration Release --no-build --output ./release

      # 6. Deployer sur myASP.NET
      - name: Deploy to myASP.NET
        shell: powershell
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}

        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          if (!(Test-Path $msdeploy)) {
            throw "Microsoft Web Deploy is not installed."
          }

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$PWD\release" `
            -dest:contentPath="$env:WEBSITE_NAME",ComputerName="$env:SERVER_COMPUTER_NAME",UserName="$env:SERVER_USERNAME",Password="$env:SERVER_PASSWORD",AuthType="Basic" `
            -allowUntrusted `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule

          if ($LASTEXITCODE -ne 0) {
            throw "Web Deploy failed with exit code $LASTEXITCODE"
          }

          Write-Host "AkarangaBank deployed successfully!"
